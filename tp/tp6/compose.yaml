name: tp

services:
  back:
    build:
      context: ../sample-app/back
      dockerfile: ../../tp5/back/multi_v2.Dockerfile
    image: tp/back:1.0.0
    ports:
      - "8080:8080"
    volumes:
      - back-data:/data

  front:
    build:
      context: ../sample-app/front
      dockerfile: ../../tp5/front/multi.Dockerfile
    image: tp/front:1.0.0
    ports:
      - "4200:4200"

volumes:
  back-data: